name: Deploy

# Staging: every push to main. Production: a tag v*.
# Never deploy from a laptop.
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    steps:
      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          TARGET: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@"$VPS_HOST" "/opt/mahali/$TARGET/deploy/deploy.sh $TARGET $GITHUB_SHA"
