components:
  schemas:
    AdjustmentReasonEnum:
      enum:
      - inventory_count
      - damaged
      - lost
      - initial
      - other
      type: string
      description: |-
        * `inventory_count` - Inventaire
        * `damaged` - Casse / défaut
        * `lost` - Perte / vol
        * `initial` - Stock initial
        * `other` - Autre
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
        actor_email:
          type: string
        realm:
          type: string
          maxLength: 10
        action:
          type: string
          maxLength: 60
        target_type:
          type: string
          maxLength: 40
        target_id:
          type: string
          maxLength: 64
        store:
          type: string
          format: uuid
          nullable: true
        store_name:
          type: string
        reason:
          type: string
        metadata: {}
        ip_address:
          type: string
          nullable: true
      required:
      - action
      - created_at
      - id
      - realm
    AuthResponse:
      type: object
      properties:
        access:
          type: string
          description: 'JWT, 10 minutes. Send as `Authorization: Bearer`.'
        refresh:
          type: string
          description: 'Single use: each refresh returns a new one. Reusing an old
            one ends the session.'
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Brand:
      type: object
      properties:
        id:
